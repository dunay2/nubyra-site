name: Import lower reference cut once
on:
  push:
    branches: ['fix/fit-lab-grounded-feet-continuous-shorts']
    paths: ['.github/workflows/import-lower-reference-once.yml']
permissions:
  contents: write
jobs:
  persist:
    if: github.actor == 'dunay2'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/fit-lab-grounded-feet-continuous-shorts
          fetch-depth: 0
      - name: Import the exact four-file correction
        run: |
          set -euo pipefail
          git merge-base --is-ancestor fd63c6aff1518684a310b0a1a5607ff20c5f3725 HEAD
          curl --fail --silent --show-error --max-time 50 'https://sb-m5bi0bcfzmzp.vercel.run/source.patch' -o /tmp/source.patch
          echo '1b2998883f859b96921bbad25e386bd1862f6a7805955936bb311fe6035c212e  /tmp/source.patch' | sha256sum -c -
          git apply --numstat /tmp/source.patch | cut -f3 | while read -r path; do
            case "$path" in
              configurador-3d/fit-lab/outfit-reference.mjs|tests/fit-lab.lower-reference.test.mjs|scripts/fit-lab-feet-review.mjs|docs/fit-lab/LOWER_REFERENCE_FINISH.md) ;;
              *) echo "Unexpected path: $path"; exit 1 ;;
            esac
          done
          git apply --check /tmp/source.patch
          git apply --index /tmp/source.patch
          curl --fail --silent --show-error --max-time 50 'https://sb-m5bi0bcfzmzp.vercel.run/review.zip' -o /tmp/review.zip
          echo '3da81e1a55c7fdf1b535da84543d4f129b19101960aef7e247adee35f92a9d81  /tmp/review.zip' | sha256sum -c -
      - uses: actions/upload-artifact@v4
        with:
          name: lower-reference-before-after
          path: /tmp/review.zip
          retention-days: 7
      - name: Persist reviewed source and remove temporary transport
        run: |
          set -euo pipefail
          git rm .github/workflows/import-lower-reference-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(fit-lab): grounded feet, smooth leg profiles and continuous shorts reference'
          git push origin HEAD:fix/fit-lab-grounded-feet-continuous-shorts
