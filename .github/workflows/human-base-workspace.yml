name: Prepare human mesh integration
on:
  push:
    branches: ['feat/fit-lab-human-base-integration']
    paths: ['.github/workflows/human-base-workspace.yml']
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Package public source and runtime geometry dependencies
        run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund three-mesh-bvh@0.9.1
          mkdir -p /tmp/human-work
          tar -czf /tmp/human-work/workspace.tgz configurador-3d scripts tests docs package.json package-lock.json node_modules
          sha256sum /tmp/human-work/workspace.tgz > /tmp/human-work/SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: human-integration-workspace
          path: /tmp/human-work
          retention-days: 3
