name: Import cut A once
on:
  push:
    branches: ['fix/fit-lab-cut-a-shirt-over-shorts']
    paths: ['.github/workflows/import-cut-a-once.yml']
permissions:
  contents: write
jobs:
  persist:
    if: github.actor == 'dunay2'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/fit-lab-cut-a-shirt-over-shorts
          fetch-depth: 0
      - name: Verify and apply scoped source
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 7aafe251a2c83440da09c72aef27105bb4ac5b2a HEAD
          curl --fail --silent --show-error --max-time 45 'https://sb-1x09x90otq2o.vercel.run/source.patch' -o /tmp/source.patch
          echo 'b2a66c3ef9f3d01b6257d38a9ff105c8b41ad6368e0a323407048c04d35fd891  /tmp/source.patch' | sha256sum -c -
          git apply --numstat /tmp/source.patch | cut -f3 | while read -r path; do
            case "$path" in
              configurador-3d/fit-lab/outfit-reference.mjs|docs/fit-lab/CUT_A_LAYERING.md|docs/fit-lab/evidence/cut-a/comparison.json|scripts/fit-lab-cut-a-review.mjs|scripts/fit-lab-layering-probe.mjs|tests/fit-lab.cut-a-layering.test.mjs) ;;
              *) echo "Unexpected path: $path"; exit 1 ;;
            esac
          done
          git apply --check /tmp/source.patch
          git apply --index /tmp/source.patch
          curl --fail --silent --show-error --max-time 45 'https://sb-1x09x90otq2o.vercel.run/before-after.zip' -o /tmp/before-after.zip
          echo 'f8cab5b9f213dcbf84d39d83e279571f42c9ec4744f5c484d090a89d130c2dfc  /tmp/before-after.zip' | sha256sum -c -
      - uses: actions/upload-artifact@v4
        with:
          name: cut-a-before-after
          path: /tmp/before-after.zip
          retention-days: 7
          if-no-files-found: error
      - name: Persist source and remove temporary transport
        run: |
          set -euo pipefail
          git rm .github/workflows/import-cut-a-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(fit-lab): compact reference thighs and layer shorts beneath the jersey'
          git push origin HEAD:fix/fit-lab-cut-a-shirt-over-shorts
