name: NUBYRA · Integrate reviewed release
on:
  push:
    branches: [fix/fit-lab-face-release-quality]
    paths: [.github/workflows/apply-face-release-cut.yml]
permissions:
  contents: write
jobs:
  integrate-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/fit-lab-face-release-quality
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify and integrate exact reviewed patch on the lab-only branch
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "48838bc76f3c77187cb2211bb81d6dae159c9579"
          python3 - <<'PY'
          import base64,gzip,hashlib,pathlib
          root=pathlib.Path('.github')
          data=''.join((root/f'face-release-delta.{i}.b64').read_text().strip() for i in (1,2))
          patch=gzip.decompress(base64.b64decode(data,validate=True))
          assert hashlib.sha256(patch).hexdigest()=='d39198c4ad2f06ecedec4f1968cfe09523d32f44cb0b8b8d31ea197a68a081c9'
          pathlib.Path('/tmp/face-release.patch').write_bytes(patch)
          PY
          git apply --unidiff-zero --check /tmp/face-release.patch
          git apply --unidiff-zero /tmp/face-release.patch
          git rm .github/face-release-delta.1.b64 .github/face-release-delta.2.b64 .github/workflows/apply-face-release-cut.yml
          git add .github/workflows/fit-lab-face-release-quality.yml configurador-3d/fit-lab scripts/build-fit-lab.mjs scripts/fit-lab-face-release-review.mjs tests/fit-lab-face-quality.test.mjs tests/fit-lab-release-performance.test.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(fit-lab): verified face, parallel assets, lazy patterns and depth-correct layers'
          git push origin HEAD:fix/fit-lab-face-release-quality
          echo "VERCEL_GIT_COMMIT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          mkdir -p artifacts/face-release
          git rev-parse HEAD > artifacts/face-release/source-commit.txt
          git archive --format=tar.gz HEAD > artifacts/face-release/source.tar.gz
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Unit quality without relaxed geometry thresholds
        run: |
          set -o pipefail
          node --test tests/fit-lab-face*.test.mjs tests/fit-lab-human-appearance.test.mjs tests/fit-lab-hair-quality.test.mjs tests/fit-lab-avatar-polish.test.mjs tests/fit-lab-reference-profiles.test.mjs tests/fit-lab-release-performance.test.mjs tests/fit-lab-outfit-proposals.test.mjs tests/fit-lab-gravity-shorts.test.mjs | tee artifacts/face-release/unit-tests.txt
      - run: npm run build:fit-lab
      - name: Build identical live baseline for comparison
        run: |
          mkdir -p /tmp/nubyra-baseline
          git archive a9efd99ccf8155e5ec2f03b62c1fca021f3533aa | tar -x -C /tmp/nubyra-baseline
          ln -s "$PWD/node_modules" /tmp/nubyra-baseline/node_modules
          cd /tmp/nubyra-baseline
          npm run build:fit-lab
      - name: Real WebGL head views
        env:
          EVIDENCE_DIR: artifacts/face-release/head
        run: node scripts/fit-lab-hair-quality-review.mjs
      - name: Full Lab visual, interaction and timing quality
        env:
          EVIDENCE_DIR: artifacts/face-release/browser
          BASELINE_DIST: /tmp/nubyra-baseline/fit-dist
        run: node scripts/fit-lab-face-release-review.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nubyra-face-release-quality
          path: |
            artifacts/face-release
            fit-dist
          retention-days: 7
