name: NUBYRA live cut · source application and review
on:
  push:
    branches: [fix/fit-lab-live-drape-edges]
    paths: [.github/apply-live-cut.mjs, .github/workflows/apply-live-cut.yml]
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: node .github/apply-live-cut.mjs
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: All unit regressions
        run: |
          set -euo pipefail
          mkdir -p artifacts/live-drape
          THREE_TEST_DIR="$PWD" npm test | tee artifacts/live-drape/tests.txt
      - run: npm run build:fit-lab
      - run: npx playwright install --with-deps chromium
      - name: Live physical frames, continuity and visual evidence
        run: |
          set -euo pipefail
          python3 -m http.server 8096 --directory fit-dist >/tmp/live-http.log 2>&1 &
          sleep 2
          node scripts/fit-lab-live-review.mjs
          FIT_LAB_URL=http://127.0.0.1:8096/fit-lab/ EVIDENCE_DIR=artifacts/live-drape/human node scripts/fit-lab-human-e2e.mjs
          EVIDENCE_DIR=artifacts/live-drape/head node scripts/fit-lab-head-review.mjs
      - name: Commit only the requested source changes on this branch
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = fix/fit-lab-live-drape-edges
          git config user.name 'NUBYRA source review'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add configurador-3d/fit-lab/human-viewer.mjs configurador-3d/fit-lab/human-cloth-worker.mjs configurador-3d/fit-lab/human-appearance.mjs scripts/build-fit-lab.mjs tests/fit-lab-human-appearance.test.mjs
          git rm .github/apply-live-cut.mjs .github/workflows/apply-live-cut.yml
          git commit -m 'fix(fit-lab): publish live settling, continuous upper edges and softer ponytail'
          git push origin HEAD:fix/fit-lab-live-drape-edges
          git rev-parse HEAD | tee artifacts/live-drape/source-commit.txt
          VERCEL_GIT_COMMIT_SHA=$(git rev-parse HEAD) npm run build:fit-lab
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nubyra-live-cut-review
          path: |
            artifacts/live-drape/
            fit-dist/
          retention-days: 7
          if-no-files-found: error
