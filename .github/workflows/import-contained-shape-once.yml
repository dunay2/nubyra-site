name: Import contained shape once
on:
  push:
    branches: ['feat/fit-lab-loose-shorts-upper-torso']
    paths: ['.github/workflows/import-contained-shape-once.yml']
permissions:
  contents: write
jobs:
  persist:
    if: github.actor == 'dunay2'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/fit-lab-loose-shorts-upper-torso
          fetch-depth: 0
      - name: Verify source and restrict change scope
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 417ae760b87caf9bc815dfd91c4d7fe22e728f94 HEAD
          curl --fail --silent --show-error --max-time 50 'https://sb-6ok5znc24ah8.vercel.run/source.patch' -o /tmp/source.patch
          echo '8ff65d57498243620e69239fd4c43315847412fa2a1194abb6c6f8f3e9a3cd8c  /tmp/source.patch' | sha256sum -c -
          git apply --numstat /tmp/source.patch | cut -f3 | while read -r path; do
            case "$path" in
              configurador-3d/fit-lab/body-surface.mjs|configurador-3d/fit-lab/outfit-reference.mjs|tests/fit-lab.contained-shape.test.mjs|scripts/fit-lab-shape-review.mjs|scripts/fit-lab-e2e.mjs|docs/fit-lab/LOOSE_SHORTS_CONTAINED_TORSO.md|docs/fit-lab/evidence/contained-shape/comparison.json) ;;
              *) echo "Unexpected path: $path"; exit 1 ;;
            esac
          done
          git apply --check /tmp/source.patch
          git apply --index /tmp/source.patch
          curl --fail --silent --show-error --max-time 50 'https://sb-6ok5znc24ah8.vercel.run/visual-review.zip' -o /tmp/visual-review.zip
          echo '119184387670637c558210b067ff6eddea556e51b874e17ced8f26a49edf88f9  /tmp/visual-review.zip' | sha256sum -c -
      - uses: actions/upload-artifact@v4
        with:
          name: contained-shape-before-after
          path: /tmp/visual-review.zip
          retention-days: 7
      - name: Persist correction and remove temporary transport
        run: |
          set -euo pipefail
          git rm .github/workflows/import-contained-shape-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(fit-lab): loose shorts envelope and contained neck-back-chest refinement'
          git push origin HEAD:feat/fit-lab-loose-shorts-upper-torso
