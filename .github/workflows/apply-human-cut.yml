name: Materialize reviewed human integration
on:
  push:
    branches: ['feat/fit-lab-human-base-integration']
    paths: ['scripts/apply-human-cut.mjs', '.github/workflows/apply-human-cut.yml']
permissions:
  contents: write
jobs:
  apply:
    if: github.actor == 'dunay2'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/fit-lab-human-base-integration
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply reviewed exact replacements and lock dependency
        run: node scripts/apply-human-cut.mjs
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Reproduce the approved geometry from hash-pinned public assets
        run: |
          set -euo pipefail
          node scripts/build-human-asset.mjs | tee /tmp/human-asset.json
          node --input-type=module -e "import{readFileSync}from'node:fs';const x=JSON.parse(readFileSync('/tmp/human-asset.json'));if(x.geometrySha256!=='8368dbced682f9564dfdde46656566d903a8f26045154febd4fa1d99dad6e4e0'||x.vertices!==13380||x.triangles!==26756)throw Error('Approved geometry mismatch');"
          curl --fail --silent --show-error 'https://raw.githubusercontent.com/makehumancommunity/mpfb2/3af0cd5a2ffba072e93a34e5f6f494fdc4813ddf/LICENSE.ASSETS.md' -o docs/fit-lab/MAKEHUMAN_ASSET_LICENSE.md
          echo 'f6089cba01cb570a24712b41ab8a586ccd3cc5ef53dc266ca50b95c288956d2c  docs/fit-lab/MAKEHUMAN_ASSET_LICENSE.md' | sha256sum -c -
      - name: Commit scoped source and generated asset, remove one-use setup
        run: |
          set -euo pipefail
          git add configurador-3d/fit-lab/app.mjs configurador-3d/fit-lab/fit-mesh.mjs configurador-3d/fit-lab/index.html configurador-3d/fit-lab/styles.css configurador-3d/fit-lab/assets/human-female.glb package.json package-lock.json scripts/build-fit-lab.mjs docs/fit-lab/MAKEHUMAN_ASSET_LICENSE.md
          git rm scripts/apply-human-cut.mjs .github/workflows/apply-human-cut.yml .github/workflows/human-base-workspace.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(fit-lab): activate approved full human mesh and worker-driven triangle contact'
          git push origin HEAD:feat/fit-lab-human-base-integration
