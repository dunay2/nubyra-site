name: Import tested Fit Lab iteration once
on:
  push:
    branches: ['feat/fit-lab-xpbd-auto-selection']
    paths: ['.github/workflows/import-fit-lab-once.yml']
permissions:
  contents: write
jobs:
  import:
    if: github.actor == 'dunay2'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/fit-lab-xpbd-auto-selection
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Retrieve exact reviewed patch and restrict paths
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 73f8973b8988fb635a7c231d4dc2a3b1a018c7e6 HEAD
          curl --fail --silent --show-error --max-time 60 'https://sb-44lyigwe2012.vercel.run/fit-lab-delivery.patch' -o /tmp/lab.patch
          echo 'f72c93b97c72c6ea2971ed43c346dd81a727a3a78a13a4d4b6a1a21e914f35b0  /tmp/lab.patch' | sha256sum -c -
          git apply --numstat /tmp/lab.patch | cut -f3 | while read -r path; do
            case "$path" in
              configurador-3d/fit-lab/*|tests/fit-lab*|docs/fit-lab/*|scripts/build-fit-lab.mjs|scripts/fit-lab-e2e.mjs|package.json|package-lock.json|.gitignore|.github/workflows/validate-configurador-3d.yml) ;;
              *) echo "Unexpected path: $path"; exit 1 ;;
            esac
          done
          git apply --exclude='.github/workflows/*' --index --binary /tmp/lab.patch
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
        env:
          THREE_TEST_DIR: ${{ github.workspace }}
      - run: npm run build:fit-lab
      - name: Persist tested source changes without overwriting concurrent work
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(fit-lab): XPBD cloth, automatic selection, combinable shape controls and verified UI'
          git push origin HEAD:feat/fit-lab-xpbd-auto-selection
