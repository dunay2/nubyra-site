name: NUBYRA · Validación del configurador 3D

on:
  pull_request:
    paths:
      - 'configurador-3d/**'
      - 'index.html'
      - 'landing.js'
      - 'landing.css'
      - 'tests/**'
      - 'README.md'
      - 'docs/configurador-3d/**'
      - 'docs/fit-lab/**'
      - 'scripts/*fit-lab*.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/validate-configurador-3d.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Sintaxis y pruebas Node 22
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependencias fijadas antes de cualquier prueba
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Comprobar sintaxis
        run: |
          for source in configurador-3d/*.mjs configurador-3d/fit-lab/*.mjs scripts/*fit-lab*.mjs; do node --check "$source"; done
          node --check landing.js
      - name: Suite completa y exportación GLB
        env:
          THREE_TEST_DIR: ${{ github.workspace }}
          NUBYRA_EXPORT_GLB: artifacts/nubyra-test-jersey.glb
        run: |
          mkdir -p artifacts
          npm test | tee artifacts/node-tests.txt
      - name: Construir Fit Lab autocontenido
        run: npm run build:fit-lab
      - name: Instalar Chromium para pruebas de navegador
        run: npx playwright install --with-deps chromium
      - name: Verificar interacción, contacto, movimiento y responsive
        env:
          EVIDENCE_DIR: artifacts/fit-lab
        run: npm run test:e2e:fit-lab | tee artifacts/browser-tests.txt
      - name: Confirmación de medidas, equipación y personalización
        env:
          EVIDENCE_DIR: artifacts/equipment
        run: node scripts/fit-lab-equipment-e2e.mjs | tee artifacts/equipment-tests.txt
      - name: Pies apoyados y pantalón continuo en frontal, lateral y tres cuartos
        env:
          EVIDENCE_DIR: artifacts/lower-reference
        run: node scripts/fit-lab-feet-review.mjs | tee artifacts/lower-reference-tests.txt
      - name: Medir contacto, capturar vistas y revisar materiales
        env:
          EVIDENCE_DIR: artifacts/natural-contact
        run: |
          node scripts/fit-lab-contact-report.mjs
          node scripts/fit-lab-visual-review.mjs
      - name: Publicar evidencia y GLB para revisión
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nubyra-fit-lab-evidence
          path: artifacts/
          if-no-files-found: error
          retention-days: 7
