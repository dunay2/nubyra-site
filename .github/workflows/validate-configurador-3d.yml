name: NUBYRA · Validación del configurador 3D
on:
  pull_request:
    paths: ['configurador-3d/**', 'tests/**', 'scripts/**', 'docs/fit-lab/**', 'package.json', 'package-lock.json', '.github/workflows/validate-configurador-3d.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    name: Human mesh, worker and legacy regression
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FIT_LAB_URL: 'http://127.0.0.1:8000/fit-lab/?body=synthetic'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install fixed dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Syntax
        run: |
          for source in configurador-3d/*.mjs configurador-3d/fit-lab/*.mjs scripts/*fit-lab*.mjs; do node --check "$source"; done
          node --check landing.js
      - name: All Node tests and GLB export
        env:
          THREE_TEST_DIR: ${{ github.workspace }}
          NUBYRA_EXPORT_GLB: artifacts/nubyra-test-jersey.glb
        run: |
          mkdir -p artifacts
          npm test | tee artifacts/node-tests.txt
      - name: Build self-contained Lab and worker
        run: |
          npm run build:fit-lab
          nohup python3 -m http.server 8000 --directory fit-dist >/tmp/fit-http.log 2>&1 &
          for attempt in 1 2 3 4 5; do curl -fsS http://127.0.0.1:8000/release.json && break || sleep 1; done
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Default human model, same-mesh collision, worker responsiveness
        env:
          FIT_LAB_URL: 'http://127.0.0.1:8000/fit-lab/'
          EVIDENCE_DIR: artifacts/human-browser
        run: node scripts/fit-lab-human-e2e.mjs | tee artifacts/human-browser-tests.txt
      - name: Early human review bundle
        uses: actions/upload-artifact@v4
        with:
          name: nubyra-avatar-review
          path: |
            artifacts/human-browser/
            artifacts/human-browser-tests.txt
            artifacts/node-tests.txt
            fit-dist/
          if-no-files-found: error
          retention-days: 7
      - name: Shorts above knee - matched before and after views
        run: |
          set -euo pipefail
          previous=/tmp/nubyra-shorts-before
          mkdir -p "$previous"
          git fetch origin 2a850821b6542f67e1ea6bf6fb8f198603ab97eb --depth=1
          git archive 2a850821b6542f67e1ea6bf6fb8f198603ab97eb configurador-3d scripts package.json package-lock.json | tar -x -C "$previous"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$previous/node_modules"
          (cd "$previous" && npm run build:fit-lab)
          env -u FIT_LAB_URL BASELINE=1 REVIEW_ROOT="$previous/fit-dist" EVIDENCE_DIR=artifacts/shorts-before node scripts/fit-lab-shorts-review.mjs | tee artifacts/shorts-before.txt
          env -u FIT_LAB_URL EVIDENCE_DIR=artifacts/shorts-after node scripts/fit-lab-shorts-review.mjs | tee artifacts/shorts-after.txt
      - name: Legacy benchmark interaction and WebGL
        env:
          EVIDENCE_DIR: artifacts/legacy
        run: npm run test:e2e:fit-lab | tee artifacts/browser-tests.txt
      - name: Legacy equipment and commit controls
        env:
          EVIDENCE_DIR: artifacts/equipment
        run: node scripts/fit-lab-equipment-e2e.mjs | tee artifacts/equipment-tests.txt
      - name: Legacy layering and pelvis reference
        env:
          EVIDENCE_DIR: artifacts/cut-a
        run: |
          node scripts/fit-lab-cut-a-review.mjs | tee artifacts/cut-a-tests.txt
          EVIDENCE_DIR=artifacts/pelvis-bust node scripts/fit-lab-pelvis-bust-review.mjs | tee artifacts/pelvis-bust-tests.txt
      - name: Legacy numerical contact matrix
        env:
          EVIDENCE_DIR: artifacts/natural-contact
        run: node scripts/fit-lab-contact-report.mjs
      - name: Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nubyra-relaxed-shorts-evidence
          path: artifacts/
          if-no-files-found: error
          retention-days: 7
