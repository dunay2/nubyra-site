name: NUBYRA · Face release quality
on:
  push:
    branches: [fix/fit-lab-face-release-quality]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fit-lab-face-release-quality
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Traceable source
        run: |
          mkdir -p artifacts/face-release
          git rev-parse HEAD > artifacts/face-release/source-commit.txt
          git archive --format=tar.gz HEAD > artifacts/face-release/source.tar.gz
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Unit quality
        run: |
          set -o pipefail
          node --test tests/fit-lab-face*.test.mjs tests/fit-lab-human-appearance.test.mjs tests/fit-lab-hair-quality.test.mjs tests/fit-lab-avatar-polish.test.mjs tests/fit-lab-reference-profiles.test.mjs tests/fit-lab-release-performance.test.mjs tests/fit-lab-outfit-proposals.test.mjs tests/fit-lab-gravity-shorts.test.mjs tests/fit-lab-responsive.test.mjs | tee artifacts/face-release/unit-tests.txt
      - name: Build the actual lab
        run: npm run build:fit-lab
      - name: Comparable live baseline
        run: |
          mkdir -p /tmp/nubyra-baseline
          git archive a9efd99ccf8155e5ec2f03b62c1fca021f3533aa | tar -x -C /tmp/nubyra-baseline
          ln -s "$PWD/node_modules" /tmp/nubyra-baseline/node_modules
          cd /tmp/nubyra-baseline
          npm run build:fit-lab
      - name: Real head views
        env:
          EVIDENCE_DIR: artifacts/face-release/head
        run: node scripts/fit-lab-hair-quality-review.mjs
      - name: Lab release regression
        env:
          EVIDENCE_DIR: artifacts/face-release/browser
          BASELINE_DIST: /tmp/nubyra-baseline/fit-dist
        run: node scripts/fit-lab-face-release-review.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nubyra-face-release-quality
          path: |
            artifacts/face-release
            fit-dist
          retention-days: 7
