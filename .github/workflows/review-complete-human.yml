name: Inspect complete human mesh candidates
on:
  push:
    branches: ['research/complete-human-mesh-review']
    paths: ['.github/workflows/review-complete-human.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Inspect public CC0 asset data, without executing downloaded content
        shell: python
        run: |
          from pathlib import Path
          import hashlib, json, struct, urllib.request
          out=Path('human-review'); out.mkdir()
          sources={
            'complete-rig':'https://www.innerscene.com/api/library/human-base-mesh-with-editable-53-bone-rig-8e7c8ab1/download',
            'riley-clothed':'https://www.innerscene.com/api/library/riley-3d-person-woman-standing-8d40398f/download'
          }
          report=[]
          for name,url in sources.items():
              request=urllib.request.Request(url,headers={'User-Agent':'NUBYRA-asset-review/1.0'})
              with urllib.request.urlopen(request,timeout=40) as response:
                  data=response.read(32*1024*1024+1)
              if len(data)>32*1024*1024: raise ValueError('Asset exceeds review size budget')
              magic,version,length=struct.unpack_from('<III',data,0)
              if (magic,version,length)!=(0x46546c67,2,len(data)): raise ValueError('Invalid GLB header')
              size,kind=struct.unpack_from('<II',data,12)
              if kind!=0x4e4f534a: raise ValueError('GLB first chunk is not JSON')
              document=json.loads(data[20:20+size])
              if any('uri' in b for b in document.get('buffers',[])): raise ValueError('External buffer not allowed')
              meshes=[]
              for mesh in document.get('meshes',[]):
                  primitives=[]
                  for p in mesh.get('primitives',[]):
                      a=document['accessors'][p['attributes']['POSITION']]
                      count=document['accessors'][p['indices']]['count'] if 'indices' in p else a['count']
                      primitives.append({'vertices':a['count'],'triangles':count//3,'min':a.get('min'),'max':a.get('max'),'material':p.get('material'),'morphTargets':len(p.get('targets',[]))})
                  meshes.append({'name':mesh.get('name'),'primitives':primitives})
              item={'name':name,'source':url,'sha256':hashlib.sha256(data).hexdigest(),'bytes':len(data),'meshes':meshes,'skeletonJoints':[len(s['joints']) for s in document.get('skins',[])],'nodes':document.get('nodes',[]),'materials':[m.get('name') for m in document.get('materials',[])],'note':'Structural inspection, not anatomical certification; no change to the Fit Lab deployment.'}
              (out/(name+'.glb')).write_bytes(data)
              (out/(name+'-metadata.json')).write_text(json.dumps(document,indent=2))
              report.append(item)
              print(json.dumps({k:item[k] for k in ['name','bytes','sha256','meshes','skeletonJoints']}))
          (out/'inspection.json').write_text(json.dumps(report,indent=2))
      - uses: actions/upload-artifact@v4
        with:
          name: complete-human-source-review
          path: human-review/
          if-no-files-found: error
          retention-days: 7
