name: Prepare published shorts workspace
on:
  push:
    branches: ['fix/fit-lab-relaxed-above-knee-shorts']
    paths: ['.github/workflows/shorts-workspace-once.yml']
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2a850821b6542f67e1ea6bf6fb8f198603ab97eb
      - name: Package exact source without dependencies or credentials
        run: |
          tar -czf /tmp/shorts-source.tgz configurador-3d scripts tests docs/fit-lab package.json package-lock.json .github/workflows/validate-configurador-3d.yml
          sha256sum /tmp/shorts-source.tgz > /tmp/source-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: shorts-published-source
          path: |
            /tmp/shorts-source.tgz
            /tmp/source-sha256.txt
          retention-days: 3
