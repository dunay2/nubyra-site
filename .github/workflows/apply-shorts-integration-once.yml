name: Apply reviewed shorts integration
on:
  push:
    branches: ['fix/fit-lab-relaxed-above-knee-shorts']
    paths: ['.github/workflows/apply-shorts-integration-once.yml']
permissions:
  contents: write
jobs:
  integrate:
    if: github.actor == 'dunay2'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/fit-lab-relaxed-above-knee-shorts
      - name: Apply exact small viewer, panel and release changes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          def replace(path,old,new):
              p=Path(path);s=p.read_text();assert s.count(old)==1,(path,old);p.write_text(s.replace(old,new))
          base='configurador-3d/fit-lab/'
          replace(base+'human-viewer.mjs','shortsLengthCm,clothSimulated:false,anthropometryValidated:false','shortsLengthCm:shorts.lengthCm,shortsRequestedLengthCm:shorts.requestedLengthCm,shortsMaxLengthCm:shorts.maxLengthCm,shortsMinLengthCm:shorts.minLengthCm,shortsAboveKneeCm:(shorts.bottom-shorts.kneeTop)*CM_PER_UNIT,shortsFit:shorts.fit,shortsVersion:shorts.version,clothSimulated:false,anthropometryValidated:false')
          block="""function onFrame(snapshot){
           if(snapshot.outfit?.shortsMaxLengthCm!==undefined){
            const o=snapshot.outfit,e=$('shorts-length');e.max=String(o.shortsMaxLengthCm);e.min=String(o.shortsMinLengthCm);
            outfitOptions.shortsLengthCm=o.shortsLengthCm;if(document.activeElement!==e)e.value=String(o.shortsLengthCm);
            if(outfitOptions.fullView)$('scene-height').textContent='Estatura de referencia '+fmt(state.bodyHeightCm)+' cm · pantalón '+fmt(o.shortsLengthCm)+' cm';
            $('shorts-fit-status').textContent='Corte suelto · máximo '+fmt(o.shortsMaxLengthCm)+' cm para quedar por encima de la rodilla. Referencia geométrica, sin simulación textil.';
           }
          """
          replace(base+'app.mjs','function onFrame(snapshot){\n',block)
          replace(base+'app.mjs',"e.setAttribute('aria-invalid','true');return;}e.removeAttribute('aria-invalid');outfitOptions.shortsLengthCm", "e.setAttribute('aria-invalid','true');e.title='Largo permitido: '+e.min+'–'+e.max+' cm';return;}e.removeAttribute('aria-invalid');e.title='';outfitOptions.shortsLengthCm")
          replace(base+'index.html','<p class="micro">Visible en «Equipación completa». Su volumen y largo son de ensayo: no es una talla recomendada ni una simulación textil.</p>','<p id="shorts-fit-status" class="micro">Corte suelto por encima de la rodilla. Referencia geométrica, sin simulación textil ni talla recomendada.</p>')
          replace('scripts/build-fit-lab.mjs',"release:'human-base-integration'","release:'human-relaxed-shorts',shortsVersion:'human-relaxed-shorts/1.1',shortsFit:'relaxed',shortsAboveKnee:true")
          expected={base+'app.mjs':'c9001c39d62996383927f334730aebf6f5c7b5230e3f4adec7c64f6265b8b4fe',base+'human-viewer.mjs':'3a17fa2faff1d243252ec4b92e7ca6053c6e11db4055b03ceaf88092e5b4bc47',base+'human-outfit.mjs':'13de5540fa9eee96a6eb383acbd8663c9c77de89d070b0e4da7df9a7cca25d55',base+'index.html':'ac0e9a77c46ebb1cde3bf2f7c4fe84eef1e7117d23b8ae8081fd3da8af3a927b','scripts/build-fit-lab.mjs':'ae3f5fae0faa4b69e0e717449ba3596b99e011b3ac7f445c724e1018678dfc46'}
          for path,digest in expected.items():
              assert hashlib.sha256(Path(path).read_bytes()).hexdigest()==digest,path
          PY
          git diff --check
      - name: Persist integration and remove one-use setup
        run: |
          set -euo pipefail
          git add configurador-3d/fit-lab/app.mjs configurador-3d/fit-lab/human-viewer.mjs configurador-3d/fit-lab/index.html scripts/build-fit-lab.mjs
          git rm .github/workflows/apply-shorts-integration-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(fit-lab): report actual loose shorts length and enforce above-knee cutoff'
          git push origin HEAD:fix/fit-lab-relaxed-above-knee-shorts
