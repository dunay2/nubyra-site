name: Refine Fit Lab equipment once
on:
  push:
    branches: ['feat/fit-lab-commit-inputs-equipment-design']
    paths: ['.github/workflows/refine-equipment-once.yml']
permissions:
  contents: write
jobs:
  persist:
    if: github.actor == 'dunay2'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/fit-lab-commit-inputs-equipment-design
          fetch-depth: 0
      - name: Verify source and restrict the correction scope
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 5fd647dbd6489c5edcdf0b4b976ee59a5f459b9c HEAD
          curl --fail --silent --show-error --max-time 50 'https://sb-4q70xpu5p7w4.vercel.run/refinement.patch' -o /tmp/refinement.patch
          echo 'd616aa62e419b21851fa75617b982206b3822828fca3efe708eaedbcf191e6f7  /tmp/refinement.patch' | sha256sum -c -
          git apply --numstat /tmp/refinement.patch | cut -f3 | while read -r path; do
            case "$path" in
              configurador-3d/fit-lab/app.mjs|configurador-3d/fit-lab/fit-viewer.mjs|configurador-3d/fit-lab/outfit-reference.mjs|scripts/fit-lab-equipment-e2e.mjs|docs/fit-lab/COMMIT_INPUTS_EQUIPMENT_RELEASE.md) ;;
              *) echo "Unexpected path: $path"; exit 1 ;;
            esac
          done
          git apply --check /tmp/refinement.patch
          git apply --index /tmp/refinement.patch
          curl --fail --silent --show-error --max-time 50 'https://sb-4q70xpu5p7w4.vercel.run/final-screenshots.zip' -o /tmp/final-screenshots.zip
          echo 'fee18fa682a1e1e0204f64d7a7e25dc123704282d2ffa2beb960cebde2e722cb  /tmp/final-screenshots.zip' | sha256sum -c -
      - uses: actions/upload-artifact@v4
        with:
          name: equipment-refined-visual-review
          path: /tmp/final-screenshots.zip
          retention-days: 7
      - name: Persist correction and remove transport
        run: |
          set -euo pipefail
          git rm .github/workflows/refine-equipment-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(fit-lab): continuous visual reference, cache invalidation and native release tests'
          git push origin HEAD:feat/fit-lab-commit-inputs-equipment-design
