name: Pelvis and bust visual review
on:
  push:
    branches: ['fix/fit-lab-continuous-pelvis-bust-guide']
    paths: ['.github/workflows/pelvis-bust-review-once.yml']
permissions:
  contents: read
jobs:
  evidence:
    if: github.actor == 'dunay2'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Retrieve exact working-view evidence
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 60 'https://sb-40m7ogz2m7bt.vercel.run/review-v1.zip' -o /tmp/review.zip
          echo '9a72e7a6018bc7f0e17d08edc1d2ac9e933cc59dca391b0786a661170ff071a6  /tmp/review.zip' | sha256sum -c -
      - uses: actions/upload-artifact@v4
        with:
          name: pelvis-bust-working-review
          path: /tmp/review.zip
          retention-days: 7
