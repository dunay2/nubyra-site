name: Import physical support correction once
on:
  push:
    branches: ['fix/fit-lab-contact-supported-physics']
    paths: ['.github/workflows/import-physical-support-once.yml']
permissions:
  contents: write
jobs:
  persist:
    if: github.actor == 'dunay2'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/fit-lab-contact-supported-physics
          fetch-depth: 0
      - name: Retrieve bounded tested-source patch and capture archive
        run: |
          set -euo pipefail
          git merge-base --is-ancestor bc74a9098bae1306afe0afef1fb0ff53aea89c84 HEAD
          curl --fail --silent --show-error --max-time 40 'https://sb-pigk45c20dxt.vercel.run/physical-support.patch' -o /tmp/support.patch
          echo '4bbe9731c67299e99486faa30e1df7b4bc588437c0642e268a3949fcf0d86dee  /tmp/support.patch' | sha256sum -c -
          git apply --numstat /tmp/support.patch | cut -f3 | while read -r path; do
            case "$path" in
              configurador-3d/fit-lab/cloth-material.mjs|configurador-3d/fit-lab/cloth-solver.mjs|configurador-3d/fit-lab/fit-mesh.mjs|configurador-3d/fit-lab/index.html|tests/fit-lab.natural-contact.test.mjs|tests/fit-lab.surface.test.mjs|tests/fit-lab.physical-laws.test.mjs|scripts/fit-lab-visual-review.mjs|docs/fit-lab/PHYSICAL_SUPPORT_RELEASE.md) ;;
              *) echo "Unexpected path $path"; exit 1 ;;
            esac
          done
          git apply --check /tmp/support.patch
          git apply --index /tmp/support.patch
          mkdir -p /tmp/support-review
          curl --fail --silent --show-error --max-time 40 'https://sb-pigk45c20dxt.vercel.run/physical-support-review.zip' -o /tmp/support-review/physical-support-review.zip
          echo '1f6ff3987bf191bebc0aa014bda9aa5dab37f94fc361f20534e59fb1110ec1e0  /tmp/support-review/physical-support-review.zip' | sha256sum -c -
      - uses: actions/upload-artifact@v4
        with:
          name: physical-support-initial-captures
          path: /tmp/support-review/
          retention-days: 7
          if-no-files-found: error
      - name: Persist only source, tests and documentation; remove this one-time workflow
        run: |
          set -euo pipefail
          git rm .github/workflows/import-physical-support-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(fit-lab): use body contact rather than fixed pins with corrected neck pattern and area mass'
          git push origin HEAD:fix/fit-lab-contact-supported-physics
