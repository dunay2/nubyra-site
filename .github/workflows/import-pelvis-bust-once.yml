name: Import pelvis and bust cut once
on:
  push:
    branches: ['fix/fit-lab-continuous-pelvis-bust-guide']
    paths: ['.github/workflows/import-pelvis-bust-once.yml']
permissions:
  contents: write
jobs:
  persist:
    if: github.actor == 'dunay2'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/fit-lab-continuous-pelvis-bust-guide
          fetch-depth: 0
      - name: Verify and apply exact scoped source
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 0258ad066255383fab125c6f62b17bdbc51cb165 HEAD
          curl --fail --silent --show-error --max-time 60 'https://sb-40m7ogz2m7bt.vercel.run/source.patch' -o /tmp/source.patch
          echo 'e65f8ec68719a1e6d5d75db22b8c8971a8f75d40015f072871276834e4377f3b  /tmp/source.patch' | sha256sum -c -
          git apply --numstat /tmp/source.patch | cut -f3 | while read -r path; do
            case "$path" in
              configurador-3d/fit-lab/app.mjs|configurador-3d/fit-lab/body-surface.mjs|configurador-3d/fit-lab/bust-reference.mjs|configurador-3d/fit-lab/fit-viewer.mjs|configurador-3d/fit-lab/outfit-reference.mjs|configurador-3d/fit-lab/index.html|scripts/fit-lab-e2e.mjs|scripts/fit-lab-layering-probe.mjs|scripts/fit-lab-pelvis-bust-review.mjs|tests/fit-lab.pelvis-bust.test.mjs|tests/fit-lab.contained-shape.test.mjs|docs/fit-lab/PELVIS_BUST_GUIDE_RELEASE.md|docs/fit-lab/evidence/pelvis-bust/metrics.json) ;;
              *) echo "Unexpected path: $path"; exit 1 ;;
            esac
          done
          git apply --check /tmp/source.patch
          git apply --index /tmp/source.patch
      - name: Preserve real before and refined views
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 60 'https://sb-40m7ogz2m7bt.vercel.run/refined-review.zip' -o /tmp/refined-review.zip
          echo '5fdda1555e9d54bb3ef7373e389960b70fdac7c5ef0896a947bcddc549b472f8  /tmp/refined-review.zip' | sha256sum -c -
      - uses: actions/upload-artifact@v4
        with:
          name: pelvis-bust-refined-review
          path: /tmp/refined-review.zip
          retention-days: 7
      - name: Persist source and remove temporary workflow
        run: |
          set -euo pipefail
          git rm .github/workflows/import-pelvis-bust-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(fit-lab): continuous pelvic saddle, calibrated projection and optional sports-bra guide'
          git push origin HEAD:fix/fit-lab-continuous-pelvis-bust-guide
