name: NUBYRA · Tied waist and HD references
on:
  push:
    branches: [fix/fit-lab-tied-waist-hd-references]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fit-lab-tied-waist-${{ github.ref }}
  cancel-in-progress: true
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply verified visual-review corrections
        run: |
          set -euo pipefail
          mkdir -p artifacts/waist-hd
          if ! test -f configurador-3d/fit-lab/fixed-short-contact.mjs; then
            node --input-type=module <<'JS'
          import {writeFile} from 'node:fs/promises';
          import {createHash} from 'node:crypto';
          import {gunzipSync} from 'node:zlib';
          const response=await fetch('https://sdmntprpolandcentral.oaiusercontent.com/files/00000000-f6ec-820a-b2ff-42a10ee65e4b/raw?se=2026-10-17T17%3A46%3A21Z&sp=r&sv=2026-02-06&sr=b&scid=61d89eb4-08c4-5290-8650-79a93d66da9b&skoid=d4d17077-8f33-42a9-bd8b-aa9d5eaf5320&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-16T19%3A25%3A58Z&ske=2026-10-17T19%3A25%3A58Z&sks=b&skv=2026-02-06&sig=zBfBDaR9RUnN3z4qp6v76ZXjg6%2BgONQKubwjviX7Fi8%3D',{signal:AbortSignal.timeout(30000)});
          if(!response.ok)throw Error('Source transfer failed: '+response.status);
          const bytes=Buffer.from(await response.arrayBuffer());if(bytes.length!==7446||createHash('sha256').update(bytes).digest('hex')!=='d671ec9de312bd5182d1677460fd69fd30405848fafcccd675c8d617bc0fe861')throw Error('Patch integrity mismatch');
          await writeFile('/tmp/waist-clearance.patch',gunzipSync(bytes));
          JS
            git apply --check /tmp/waist-clearance.patch
            git apply /tmp/waist-clearance.patch
            test "$GITHUB_REF_NAME" = fix/fit-lab-tied-waist-hd-references
            git config user.name 'NUBYRA source review'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add configurador-3d/fit-lab scripts tests docs/fit-lab/TIED_WAIST_HD_CUT.md
            git commit -m 'fix(fit-lab): clear local short contacts and retain outfit when fixed rise is infeasible'
            git push origin HEAD:fix/fit-lab-tied-waist-hd-references
          fi
          git rev-parse HEAD | tee artifacts/waist-hd/source-commit.txt
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Complete unit regressions and fixed pattern invariants
        run: |
          set -euo pipefail
          THREE_TEST_DIR="$PWD" npm test | tee artifacts/waist-hd/unit-tests.txt
      - name: Build the exact source commit
        run: VERCEL_GIT_COMMIT_SHA=$(git rev-parse HEAD) npm run build:fit-lab
      - run: npx playwright install --with-deps chromium
      - name: Real browser waist, HD, gallery and human checks
        run: |
          set -euo pipefail
          python3 -m http.server 8131 --bind 127.0.0.1 --directory fit-dist >/tmp/waist-http.log 2>&1 &
          sleep 2
          node scripts/fit-lab-waist-hd-review.mjs | tee artifacts/waist-hd/browser-tests.txt
          FIT_LAB_URL=http://127.0.0.1:8131/fit-lab/ EVIDENCE_DIR=artifacts/waist-hd/gallery node scripts/fit-lab-reference-gallery-review.mjs
          FIT_LAB_URL=http://127.0.0.1:8131/fit-lab/ EVIDENCE_DIR=artifacts/waist-hd/human node scripts/fit-lab-human-e2e.mjs
      - name: Reproducible source evidence
        if: always()
        run: git archive --format=tar HEAD | gzip > artifacts/waist-hd/source.tar.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nubyra-tied-waist-hd-review
          path: |
            artifacts/waist-hd/
            fit-dist/
          retention-days: 7
          if-no-files-found: error
