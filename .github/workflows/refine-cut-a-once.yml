name: Refine cut A once
on:
  push:
    branches: ['fix/fit-lab-cut-a-shirt-over-shorts']
    paths: ['.github/workflows/refine-cut-a-once.yml']
permissions:
  contents: write
jobs:
  persist:
    if: github.actor == 'dunay2'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/fit-lab-cut-a-shirt-over-shorts
          fetch-depth: 0
      - name: Verify and apply scoped refinement
        run: |
          set -euo pipefail
          git merge-base --is-ancestor e829010a51167356d57dfa1be26871f48fdfd338 HEAD
          curl --fail --silent --show-error --max-time 45 'https://sb-1x09x90otq2o.vercel.run/refinement.patch' -o /tmp/refinement.patch
          echo '25cccfa19fc18b899433572f69a613fcc562d04dcb0cdb003e1c30d13bbba5f7  /tmp/refinement.patch' | sha256sum -c -
          git apply --numstat /tmp/refinement.patch | cut -f3 | while read -r path; do
            case "$path" in
              configurador-3d/fit-lab/outfit-reference.mjs|docs/fit-lab/CUT_A_LAYERING.md|docs/fit-lab/evidence/cut-a/comparison.json|scripts/fit-lab-layering-probe.mjs|tests/fit-lab.cut-a-layering.test.mjs) ;;
              *) echo "Unexpected path: $path"; exit 1 ;;
            esac
          done
          git apply --check /tmp/refinement.patch
          git apply --index /tmp/refinement.patch
          curl --fail --silent --show-error --max-time 45 'https://sb-1x09x90otq2o.vercel.run/refined.zip' -o /tmp/refined.zip
          echo '7ff0fa2edbaa89ec094bc22b8fa9c52a00eb08c1c8e9866f07d16b21e44619ab  /tmp/refined.zip' | sha256sum -c -
      - uses: actions/upload-artifact@v4
        with:
          name: cut-a-refined-before-after
          path: /tmp/refined.zip
          retention-days: 7
          if-no-files-found: error
      - name: Persist reviewed source and remove temporary transport
        run: |
          set -euo pipefail
          git rm .github/workflows/refine-cut-a-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(fit-lab): align pants sections with body and preserve existing-contact diagnostics'
          git push origin HEAD:fix/fit-lab-cut-a-shirt-over-shorts
