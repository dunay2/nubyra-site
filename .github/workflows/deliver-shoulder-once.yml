name: Deliver tested shoulder correction once
on:
  push:
    branches: ['feat/fit-lab-shoulder-torso']
    paths: ['.github/workflows/deliver-shoulder-once.yml']
permissions:
  contents: write
jobs:
  deliver:
    if: github.actor == 'dunay2'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/fit-lab-shoulder-torso
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Retrieve the exact tested patch and restrict changed paths
        run: |
          set -euo pipefail
          git merge-base --is-ancestor e51b988e2f365394ceacf227b7400f65919d3527 HEAD
          curl --fail --silent --show-error --max-time 50 'https://sb-54b99nzbdl7r.vercel.run/release.patch' -o /tmp/shoulders.patch
          echo '4b35628c0b79ec9b76063ed6134da1b3b63a9814ea1508cfb2ff8863df263e8d  /tmp/shoulders.patch' | sha256sum -c -
          git apply --numstat /tmp/shoulders.patch | cut -f3 | while read -r path; do
            case "$path" in
              configurador-3d/fit-lab/body-surface.mjs|configurador-3d/fit-lab/cloth-solver.mjs|configurador-3d/fit-lab/fit-mesh.mjs|configurador-3d/fit-lab/fit-viewer.mjs|configurador-3d/fit-lab/index.html|tests/fit-lab.shoulders.test.mjs|scripts/fit-lab-e2e.mjs|docs/fit-lab/SHOULDERS_RELEASE.md|docs/fit-lab/evidence/shoulders/*) ;;
              *) echo "Unexpected path: $path"; exit 1 ;;
            esac
          done
          git apply --check /tmp/shoulders.patch
          git apply --index --binary /tmp/shoulders.patch
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run all previous and new tests
        run: npm test
        env:
          THREE_TEST_DIR: ${{ github.workspace }}
      - run: npm run build:fit-lab
      - run: npx playwright install --with-deps chromium
      - name: Browser regression and shoulder views
        run: npm run test:e2e:fit-lab
        env:
          EVIDENCE_DIR: artifacts/shoulders-browser
      - uses: actions/upload-artifact@v4
        with:
          name: shoulders-browser-evidence
          path: artifacts/shoulders-browser
          if-no-files-found: error
          retention-days: 7
      - name: Persist tested correction and remove this one-use workflow
        run: |
          set -euo pipefail
          git rm .github/workflows/deliver-shoulder-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(fit-lab): closed torso to shoulders, shared contact and verified regression'
          git push origin HEAD:feat/fit-lab-shoulder-torso
