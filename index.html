<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#101726" />
    <meta name="description" content="Página temporal de NUBYRA." />
    <title>NUBYRA · Página de prueba</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #101726;
        color: #f7f9fc;
      }

      * { box-sizing: border-box; }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        overflow-x: hidden;
        background:
          radial-gradient(circle at 83% 18%, rgba(76, 216, 198, .19), transparent 32rem),
          radial-gradient(circle at 14% 80%, rgba(109, 137, 241, .16), transparent 34rem),
          #101726;
      }

      body::before {
        position: fixed;
        inset: 0;
        z-index: -1;
        background-image: linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
        background-size: 48px 48px;
        content: "";
        mask-image: linear-gradient(to bottom, black, transparent 90%);
      }

      .shell {
        width: min(1120px, calc(100% - 48px));
        min-height: 100vh;
        margin: auto;
        display: flex;
        flex-direction: column;
      }

      header, footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      header { padding: 34px 0; }
      .brand { display: flex; align-items: center; gap: 13px; font-size: 1rem; font-weight: 800; letter-spacing: .18em; }
      .mark { display: grid; place-items: center; width: 38px; height: 38px; border-radius: 12px; background: linear-gradient(145deg, #72f4d2, #6c8cec); color: #102034; font-size: 1.2rem; letter-spacing: 0; }
      .eyebrow { color: #9eacc3; font-size: .77rem; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }

      main { flex: 1; display: grid; align-content: center; padding: 64px 0 100px; }
      .pill { display: inline-flex; align-items: center; gap: 9px; width: fit-content; padding: 9px 14px; border: 1px solid #40615f; border-radius: 999px; background: rgba(99, 220, 197, .09); color: #a6f5df; font-size: .8rem; font-weight: 700; }
      .dot { width: 7px; height: 7px; border-radius: 50%; background: #77eac5; box-shadow: 0 0 12px #77eac5; }
      h1 { max-width: 830px; margin: 29px 0 20px; font-size: clamp(3.6rem, 9vw, 7.5rem); font-weight: 750; letter-spacing: -.075em; line-height: .98; }
      h1 span { display: block; background: linear-gradient(90deg, #d7e6ff, #8fe7d1); color: transparent; background-clip: text; }
      .lead { max-width: 570px; margin: 0; color: #aebbd0; font-size: clamp(1.05rem, 2vw, 1.35rem); line-height: 1.65; }
      .rule { width: 80px; height: 3px; margin: 42px 0 24px; border-radius: 2px; background: linear-gradient(90deg, #82e9ce, #7d9af6); }
      .note { max-width: 540px; margin: 0; color: #8290aa; font-size: .9rem; line-height: 1.6; }

      footer { gap: 18px; padding: 26px 0 34px; border-top: 1px solid rgba(190, 207, 234, .13); color: #8190aa; font-size: .78rem; }
      footer strong { color: #a8b6ca; font-weight: 650; }

      @media (max-width: 600px) {
        .shell { width: min(100% - 36px, 1120px); }
        header { padding: 24px 0; }
        .eyebrow { display: none; }
        main { padding: 72px 0 90px; }
        h1 { letter-spacing: -.065em; }
        footer { align-items: flex-start; flex-direction: column; }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header>
        <div class="brand"><span class="mark" aria-hidden="true">N</span><span>NUBYRA</span></div>
        <span class="eyebrow">Un nuevo espacio digital</span>
      </header>

      <main>
        <span class="pill"><span class="dot" aria-hidden="true"></span>Página de prueba</span>
        <h1>Algo nuevo<br /><span>está tomando forma.</span></h1>
        <p class="lead">La web de NUBYRA está en preparación. Esta portada temporal permite comprobar que el dominio llega al sitio correctamente.</p>
        <div class="rule" aria-hidden="true"></div>
        <p class="note">Pronto habrá más información aquí.</p>
      </main>

      <footer><strong>NUBYRA</strong><span>Sitio temporal · nubyra.es</span></footer>
    </div>
  </body>
</html>
