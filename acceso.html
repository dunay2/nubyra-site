      <span class="eyebrow">Acceso al piloto</span>

      <h1>Acceso a NUBYRA</h1>

      <div class="nubyra-auth__actions">
        <button id="auth-login" type="button" hidden>Continuar con Google</button>
        <button id="auth-retry" type="button" hidden>Reintentar</button>
        <button id="auth-logout" type="button" hidden>Salir de NUBYRA</button>
